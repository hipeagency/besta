# Supabase al día con el repo: al subir a v2 algo de supabase/, aplica
# las migraciones pendientes y despliega todas las Edge Functions
# (verify_jwt de cada una en supabase/config.toml).
# Secretos del repo: SUPABASE_ACCESS_TOKEN; opcionales CF_DEPLOY_HOOK (va a
# Vault, para que la web se recompile sola) y BANDSINTOWN_APP_ID (secreto
# de la función de importación).
name: supabase

on:
  push:
    branches: [v2]
    paths:
      - "supabase/**"
      - "scripts/apply-migrations.py"
      - ".github/workflows/supabase.yml"
  workflow_dispatch:

# Uno detrás de otro: dos migraciones a la vez no.
concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: vjydiddybwutbcfigtie  # público: va en la URL de la API
      CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
      BANDSINTOWN_APP_ID: ${{ secrets.BANDSINTOWN_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Migraciones
        run: python3 scripts/apply-migrations.py

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api

      - name: Secreto de Bandsintown
        if: env.BANDSINTOWN_APP_ID != ''
        run: supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" BANDSINTOWN_APP_ID="$BANDSINTOWN_APP_ID"
